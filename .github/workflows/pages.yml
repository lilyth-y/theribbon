name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/media/videos _site/media/couples
          cp web/index.html _site/index.html
          cp web/media/*.jpg _site/media/
          find content/videos -maxdepth 1 -type f -name '*.mp4' -exec cp -t _site/media/videos/ {} +
          while IFS= read -r rel; do
            mkdir -p "_site/media/couples/$(dirname "$rel")"
            cp "content/couples/$rel" "_site/media/couples/$rel"
          done < <(grep -oE 'media/couples/[^"]+\.(jpg|png)' web/index.html | sed 's#^media/couples/##')
          video_count="$(find _site/media/videos -maxdepth 1 -type f -name '*.mp4' | wc -l)"
          poster_count="$(find _site/media/couples -type f \( -name '*.jpg' -o -name '*.png' \) | wc -l)"
          test "$video_count" -eq 10
          test "$poster_count" -eq 10
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
